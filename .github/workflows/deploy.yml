name: Deploy

# Deux déclencheurs, un seul effet : mettre en ligne UNE version, une fois.
#   - un tag vX.Y.Z poussé à la main (npm run release) ;
#   - une fusion dans main qui change la version de package.json : le tag vX.Y.Z est alors
#     posé automatiquement, APRÈS un déploiement réussi.
# Une fusion qui ne change pas la version ne déploie rien : le tag existe déjà, la vérification
# s'arrête là. Le build tourne ici (GitHub Actions), pas chez Cloudflare (Direct Upload).
on:
  push:
    branches: [main]
    tags:
      - 'v*'

# Un seul déploiement à la fois, jamais annulé en cours de route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # poser le tag après un déploiement réussi

jobs:
  # Décide s'il y a quelque chose à publier et sous quel tag.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Décider
        id: decide
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            deploy=true
          else
            tag="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              echo "Le tag $tag existe déjà : rien à publier."
              deploy=false
            else
              echo "Nouvelle version $tag : déploiement."
              deploy=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Format vX.Y.Z, package.json = tag, entrée CHANGELOG, pas de placeholder wrangler.
      - name: Vérifier le tag
        run: bash scripts/check-tag.sh "$TAG"

      - name: Vérifier que le commit taggé est dans main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit taggé n'appartient pas à main. Déploiement refusé." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Le binding de Pages pointe sur lhote-api : le Worker passe donc en premier.
      - name: Déployer le Worker (API + Durable Object)
        run: npx wrangler deploy --config worker/wrangler.toml --var APP_VERSION:${TAG#v}

      # Crée le projet Pages (Direct Upload) au premier déploiement ; s'il existe déjà, la commande
      # échoue et on continue : le déploiement qui suit échouerait clairement pour toute autre cause.
      - name: S'assurer que le projet Pages existe
        run: npx wrangler pages project create lhote --production-branch=main || echo "Projet Pages déjà présent."

      # Le nom `lhote.pages.dev` est pris par un tiers : l'adresse réelle du projet est celle que
      # wrangler affiche. On la lit ici pour vérifier CE déploiement, pas une adresse devinée.
      - name: Déployer Pages
        id: pages
        shell: bash
        run: |
          npx wrangler pages deploy dist --project-name=lhote --branch=main | tee pages.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' pages.log | tail -n1)"
          [ -n "$url" ] || { echo "Adresse du déploiement introuvable dans la sortie de wrangler." >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé sur $url"

      # Le déploiement n'est « réussi » que si le site répond avec la version du tag, que le
      # Worker et son Durable Object répondent, et que l'app shell est servi.
      - name: Vérifier le site en ligne
        env:
          SITE_URL: ${{ steps.pages.outputs.url }}
        run: |
          expected="${TAG#v}"
          for attempt in $(seq 1 12); do
            version="$(curl -fsS "$SITE_URL/api/health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || true)"
            if [ "$version" = "$expected" ]; then break; fi
            echo "Tentative $attempt : version en ligne '$version', attendue '$expected'."
            sleep 10
          done
          [ "$version" = "$expected" ] || { echo "La version en ligne ne correspond pas." >&2; exit 1; }
          curl -fsS "$SITE_URL/" | grep -q "L'Hôte"
          curl -fsS -o /dev/null "$SITE_URL/manifest.webmanifest"
          curl -fsS -o /dev/null "$SITE_URL/sw.js"
          # Un vrai saut traverse Pages, le Worker, le Durable Object et le KV.
          player="$(node -e "console.log(require('crypto').randomUUID())")"
          curl -fsS -X POST -H "X-Player-Id: $player" "$SITE_URL/api/leap" | grep -q '"leap"'
          # Nettoyage : le joueur de test ne doit pas subsister (RGPD).
          curl -fsS -X DELETE -H "X-Player-Id: $player" "$SITE_URL/api/state" > /dev/null

      # Fusion dans main : le tag est posé seulement maintenant que tout est en ligne et vérifié.
      # Un déploiement raté ne laisse donc aucun tag ; relancer le job reprend au début.
      - name: Poser le tag de la version
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
