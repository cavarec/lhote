name: Deploy

# Déclenché UNIQUEMENT par un tag vX.Y.Z. Un tag = un déploiement.
# Aucune autre source (push main, PR, schedule) n'atteint ce workflow.
# Le build tourne ici (GitHub Actions), pas chez Cloudflare : le projet Pages est
# en Direct Upload (voir README).
on:
  push:
    tags:
      - 'v*'

# Un seul déploiement à la fois, jamais annulé en cours de route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Format vX.Y.Z, package.json = tag, entrée CHANGELOG, pas de placeholder wrangler.
      - name: Vérifier le tag
        run: bash scripts/check-tag.sh "$GITHUB_REF_NAME"

      - name: Vérifier que le commit taggé est dans main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit taggé n'appartient pas à main. Déploiement refusé." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Le binding de Pages pointe sur lhote-api : le Worker passe donc en premier.
      - name: Déployer le Worker (API + Durable Object)
        run: npx wrangler deploy --config worker/wrangler.toml

      - name: Déployer Pages
        run: npx wrangler pages deploy dist --project-name=lhote --branch=main
